[project]
name = "visualiser-ml"
version = "0.1.0"
description = "VISUALISER inference service: sign recognition + constrained text generation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["visualiser_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
