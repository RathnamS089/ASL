[project]
name = "visualiser-ml"
version = "0.1.0"
description = "VISUALISER inference service: sign recognition + constrained text generation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Sign recognition (Apple Silicon): MediaPipe landmarks, MLX classifier, ISLR parquet reading.
recognition = ["mediapipe==1.1.1", "ai-edge-litert==2.3.0", "mlx>=0.29", "numpy>=1.26", "pyarrow>=15"]
# Generator serving and LoRA fine-tuning on the M4.
llm = ["mlx-lm==0.32.2"]

[tool.setuptools.packages.find]
include = ["visualiser_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
